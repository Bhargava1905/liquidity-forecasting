[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liquidity-forecasting"
version = "2.0.0"
description = "Reproducible synthetic short-term liquidity forecasting pipeline"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
